---
# yamllint disable rule:colons
#   ___   _   _  _         __      __
#  | _ \ (_) | || |  _  _  \ \    / /
#  |  _/ | | | __ | | || |  \ \/\/ /
#  |_|   |_| |_||_|  \_,_|   \_/\_/
# =============================================================================
# pihuw build control — data, not script.
#
# Everything generic lives in clog: the bc-* workers come from util's embedded
# konfig, and `clog ci deploy` runs the deployer for each target's kind. This
# file holds only what is specific to this repo.
#
# Version and production mode come from GIT TAGS via `clog BC`; data/releases.yaml
# is changelog history and is never read to decide dev-vs-prod.
#
#   clog Build      -> BC flow: hugo -> kodata/
#   clog Deploy     -> ci deploy: kodata/ -> gh-pages -> mrmxf.github.io/pihuw
#   clog watch      -> local hugo server
# -----------------------------------------------------------------------------
clog:
  # changelog history for humans. BC does not decide anything from it.
  releases-path: "data/releases.yaml"
  stash-path: tmp/BcStash.yaml

# =============================================================================
#    ___   ___
#   / __| |_ _|
#  | (__   | |
#   \___| |___|
# -----------------------------------------------------------------------------
# `clog ci policy` explains any decision this block produces.
ci:
  policy:
    # every event may build, including a laptop; only a release tag publishes
    build: [branch, tag, dispatch, schedule, local]
    deploy:
      prod: {tags: ["v*"], schedule: true}

  modes:
    # One Pages site, so both modes share a base URL. A dev build differs by
    # what it includes, not where it goes, and it is not deployed.
    dev:
      base-url: "https://mrmxf.github.io/pihuw/"
    prod:
      base-url: "https://mrmxf.github.io/pihuw/"

  targets:
    pages:
      kind: github-pages
      # prod only: there is a single Pages site and a dev push would overwrite
      # the published docs with a draft build.
      modes: [prod]
      prod:
        dir: kodata          # hugo.yaml publishDir
        branch: gh-pages

#               _                       _
#   ||_  _ _   (_)  _ __   _ __   ___  | |_   ___
#  (_-< | ' \  | | | '_ \ | '_ \ / -_) |  _| (_-<
#  / _/ |_||_| |_| | .__/ | .__/ \___|  \__| /__/
#   ||             |_|    |_|
# -----------------------------------------------------------------------------
snippets:
  # No content symlink. config/_default/module.yaml mounts documentation/content
  # as content/, so a bare clone builds the whole docs site.
  watch: |
    hugo server --port=1313 --logLevel debug --buildDrafts --buildFuture --buildExpired --cleanDestinationDir

  project:
    config: |
      export PROJECT=pihuw
      export DOCKER_NS=mrmxf
    has:
      hugo: hugo version|grep -oE '[0-9]+\.[0-9]+\.[0-9]+'|head -1
    needs:
      # module.yaml stores it as v0.166.0; `hugo version` reports 0.166.0
      hugo: yq -r '.hugoVersion.min' config/_default/module.yaml|grep -oE '[0-9]+\.[0-9]+\.[0-9]+'

  build: |
    export CHK="build"
    export MAKE="hugo"; [[ "MAKE" == "$1" ]] && MAKE="$2"
    clog BC flow
  deploy: clog ci deploy

# =============================================================================
#    ___   _                 _
#   / __| | |_    ___   __  | |__
#  | (__  | ' \  / -_) / _| | / /
#   \___| |_||_| \___| \__| |_\_\
# -----------------------------------------------------------------------------
check:
  build:
    blocks:
      - name: hugo version
        try: |
          clog BC semver "$(clog project needs hugo)" "$(clog project has hugo)" >/dev/null 2>&1
        ok: clog Log -I "hugo $(clog project has hugo) satisfies $(clog project needs hugo)"
        catch: |
          clog Log -E "hugo: need >= $(clog project needs hugo), got $(clog project has hugo)"
