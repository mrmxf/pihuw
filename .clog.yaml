# =============================================================================
# pihuw build control — data, not script.
#
# Everything generic lives in clog: the bc-* workers and the four verbs come
# from util's embedded konfig, and `clog CI deploy` runs the deployer for each
# target's kind. This file holds only what is specific to this repo.
#
# Version and production mode come from GIT TAGS via `clog BC`; data/releases.yaml
# is changelog history and is never read to decide dev-vs-prod.
#
#   clog watch              hugo server, from ci.stack[0].watch
#   clog build [dev|prod]   every gate, then hugo -> kodata/
#   clog build --fast       no gates at all, and no claim about the branch
#   clog deploy prod        kodata/ -> gh-pages -> mrmxf.github.io/pihuw
#
# The verbs are util's, not this repo's: there are no build/watch/deploy
# snippets below any more. `clog build` means READY TO PUSH — it runs pre-build,
# this repo's own checks, lint and the scan sweeps, and a failure now fails the
# build in dev as well as prod. `--fast` is the escape hatch and drops the WHOLE
# check list. See util's ci/SCANNING.md.
# -----------------------------------------------------------------------------
clog:
  # changelog history for humans. BC does not decide anything from it.
  releases-path: "data/releases.yaml"

# =============================================================================
#    ___   ___
#   / __| |_ _|
#  | (__   | |
#   \___| |___|
# -----------------------------------------------------------------------------
# `clog CI show policy` explains any decision this block produces.
ci:
  # the build job uploads _clog_build/ + kodata/ under this name and the deploy
  # job downloads it - without ci.artifact the two jobs share nothing and the
  # deploy finds an empty kodata/
  artifact: pihuw-site
  title: pihuw docs

  # ▬▬▬▬ stack — the build unit the verbs act on ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
  # One stack, so every selector resolves to it and `clog build pihuw` is never
  # needed. The type sets the toolchain, the watch loop, the check list and the
  # make list; the three overrides below are where pihuw differs from a stock
  # hugo repo. Written in long form rather than as `stack: hugo` precisely
  # because of those overrides.
  stack:
    - name: pihuw
      type: hugo
      # the hugo type assumes a site that also ships as a container. pihuw
      # publishes to Pages and builds no image, so ko is dropped from both
      # lists. kodata/ is hugo's publishDir here for historical reasons - it is
      # not ko-data, and nothing runs ko.
      tools: [hugo, trivy]
      make:  [hugo]
      # pre-build lint scan is the type default; `pihuw` is this repo's own
      # gate, added below in check:. It is NOT named `build`, which would now
      # read as the verb.
      chk:   [pre-build, pihuw, lint, scan]
      # No content symlink. config/_default/module.yaml mounts
      # documentation/content as content/, so a bare clone serves the docs site.
      watch: hugo server --port=1313 --logLevel debug --buildDrafts --buildFuture --buildExpired --cleanDestinationDir

  # ▬▬▬▬ scan — two axes, and neither may be silent ▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
  # `vuln` and `secrets` name WHAT is examined, never which tool examines it.
  scan:
    source:
      # The worktree is the only place in this repo with dependencies worth a
      # vulnerability sweep: go.mod pulls the hugo modules, and the theme's own
      # vendored CSS lives in assets/css/. This axis runs on every build,
      # deploying or not, which is what the old `if: do_deploy` step never did.
      vuln: repo
      secrets: true
      severity: HIGH,CRITICAL
      ignore-unfixed: true
      # kodata is hugo's publishDir and resources/ is its asset cache - both are
      # generated from what this sweep already reads, so scanning them again
      # only slows it down. kodata's rendered output IS swept, for secrets, by
      # the pages target below.
      skip-dirs: node_modules,vendor,public,kodata,resources,_clog_build,_clog_deploy

  policy:
    # every event may build, including a laptop; only a release tag publishes
    build: [branch, tag, dispatch, schedule, local]
    deploy:
      # a v* tag publishes; a manual run may also publish (it checks out the
      # newest release tag first - see .github/workflows/build-deploy.yaml).
      # dispatch is needed because a manual run's ref is the branch it was
      # launched from, so it can never match the tag glob.
      prod: {tags: ["v*"], schedule: true, dispatch: true}

  modes:
    # One Pages site, so both modes share a base URL. A dev build differs by
    # what it includes, not where it goes, and it is not deployed.
    dev:
      base-url: "https://mrmxf.github.io/pihuw/"
    prod:
      base-url: "https://mrmxf.github.io/pihuw/"

  targets:
    pages:
      kind: github-pages
      # prod only: there is a single Pages site and a dev push would overwrite
      # the published docs with a draft build.
      modes: [prod]
      prod:
        dir: kodata          # hugo.yaml publishDir
        branch: gh-pages
      # github-pages has no default sweep and clog refuses to invent one, so
      # this block is required rather than optional.
      scan:
        # A rendered site has no lockfiles and no binaries: a filesystem
        # vulnerability sweep of kodata/ finds nothing and reports it in green,
        # which reads as coverage and is not. The dependencies are in the
        # source, and ci.scan.source above is where they get swept.
        vuln: none
        # Secrets are a different question and the answer here is yes: this is
        # the last look at the bytes that become public, and a token that
        # reached a partial or a data file would show up nowhere else.
        secrets: true
        # ref is written out rather than resolved from prod.dir because the
        # artifact sweep deliberately ignores deploy-mode membership - it visits
        # this prod-only target on dev builds too, so that a pull request is
        # scanned. Leaving ref implicit would make it ask for prod data in dev.
        ref: kodata

#               _                       _
#   ||_  _ _   (_)  _ __   _ __   ___  | |_   ___
#  (_-< | ' \  | | | '_ \ | '_ \ / -_) |  _| (_-<
#  / _/ |_||_| |_| | .__/ | .__/ \___|  \__| /__/
#   ||             |_|    |_|
# -----------------------------------------------------------------------------
# watch, build and deploy are NOT here. util's konfig defines all three, and a
# repo snippet of the same name is overlaid on top of it - so a local copy is
# how a repo silently stops getting the shared behaviour. ci.stack above is the
# supported way to say what is different here.
snippets:
  project:
    config: |
      export PROJECT=pihuw
    has:
      hugo: hugo version|grep -oE '[0-9]+\.[0-9]+\.[0-9]+'|head -1
    needs:
      # module.yaml stores it as v0.166.0; `hugo version` reports 0.166.0
      hugo: yq -r '.hugoVersion.min' config/_default/module.yaml|grep -oE '[0-9]+\.[0-9]+\.[0-9]+'

# =============================================================================
#    ___   _                 _
#   / __| | |_    ___   __  | |__
#  | (__  | ' \  / -_) / _| | / /
#   \___| |_||_| \___| \__| |_\_\
# -----------------------------------------------------------------------------
# This repo's own gate, named in ci.stack[0].chk. pre-build, lint and scan are
# util's and are not repeated here.
check:
  pihuw:
    blocks:
      - name: hugo version
        try: |
          clog BC semver satisfies "$(clog project needs hugo)" "$(clog project has hugo)"
        ok: clog Log -I "hugo $(clog project has hugo) satisfies $(clog project needs hugo)"
        catch: |
          clog Log -E "hugo: need >= $(clog project needs hugo), got $(clog project has hugo)"
