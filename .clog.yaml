---
# yamllint disable rule:colons
#   ___   _   _  _         __      __
#  | _ \ (_) | || |  _  _  \ \    / /
#  |  _/ | | | __ | | || |  \ \/\/ /
#  |_|   |_| |_||_|  \_,_|   \_/\_/
# =============================================================================
# pihuw build control.
#
# Everything generic lives in clog (embedded konfig.yaml + callable workflows).
# This file holds ONLY what is specific to this repo. If something here would be
# true of any hugo site, it belongs in clog, not here.
#
# Version and production mode come from GIT TAGS, via `clog BC`. releases.yaml is
# changelog history only - BC never decides from it. There is deliberately no
# bc-prod-logic-*, no bc-releases-yaml and no git tag override: those were the old
# shell era and clog does all of it now.
#
#   clog Build     -> BC flow: metadata + hugo  -> kodata/
#   clog Deploy    -> BC flow: deploy-ghpages   -> gh-pages branch
#   clog watch     -> local hugo server
# -----------------------------------------------------------------------------
kfg:
  # release history for humans and the changelog. NOT used to pick dev/prod.
  releases-path: "data/releases.yaml"
clog:
  releases-path: "data/releases.yaml"
  stash-path: tmp/BcStash.yaml

#               _                       _
#   ||_  _ _   (_)  _ __   _ __   ___  | |_   ___
#  (_-< | ' \  | | | '_ \ | '_ \ / -_) |  _| (_-<
#  / _/ |_||_| |_| | .__/ | .__/ \___|  \__| /__/
#   ||             |_|    |_|
# -----------------------------------------------------------------------------
snippets:
  # ---------------------------------------------------------------------------
  # No content symlink. config/_default/module.yaml mounts documentation/content
  # as content/, so a bare clone builds the whole docs site. Do not reintroduce
  # `ln -s documentation/content content` - it shadows the mount and every doc
  # that described it as required was wrong.
  watch: |
    hugo server --port=1313 --logLevel debug --buildDrafts --buildFuture --buildExpired --cleanDestinationDir

  project:
    config: |
      export PROJECT=pihuw
      export DOCKER_NS=mrmxf
      # consumed by clog's generic bc-deploy-ghpages worker
      export GHP_DIR=kodata
      export GHP_BRANCH=gh-pages
      # consumed by clog's generic bc-metadata worker: publish build identity as
      # hugo site data so the footer reads git, not releases.yaml
      export BUILDINFO_JSON=data/buildinfo.json
    has:
      hugo: hugo version|grep -oE '[0-9]+\.[0-9]+\.[0-9]+'|head -1
    needs:
      # module.yaml stores it as v0.166.0; `hugo version` reports 0.166.0
      hugo: yq -r '.hugoVersion.min' config/_default/module.yaml|grep -oE '[0-9]+\.[0-9]+\.[0-9]+'

  # ---------------------------------------------------------------------------
  # MAKE/CHK overrides follow the clog convention: `clog Build MAKE "hugo ko"`
  build: |
    export CHK="build"
    export MAKE="metadata hugo"; [[ "MAKE" == "$1" ]] && MAKE="$2"
    clog BC flow
  deploy: |
    export CHK="tools"
    export MAKE="deploy-ghpages"; [[ "MAKE" == "$1" ]] && MAKE="$2"
    clog BC flow

# =============================================================================
#    ___   _                 _
#   / __| | |_    ___   __  | |__
#  | (__  | ' \  / -_) / _| | / /
#   \___| |_||_| \___| \__| |_\_\
# -----------------------------------------------------------------------------
check:
  build:
    blocks:
      - name: hugo version
        try: |
          clog BC semver "$(clog project needs hugo)" "$(clog project has hugo)" >/dev/null 2>&1
        ok: clog Log -I "hugo $(clog project has hugo) satisfies $(clog project needs hugo)"
        catch: |
          clog Log -E "hugo: need >= $(clog project needs hugo), got $(clog project has hugo)"
  tools:
    blocks:
      - name: gh cli
        try: "gh --version >/dev/null 2>&1"
        ok: clog Log -I "gh $(gh --version|head -1|grep -oE '[0-9]+\.[0-9]+\.[0-9]+') present"
        catch: clog Log -W "gh not found - bc-deploy-ghpages will install it"
