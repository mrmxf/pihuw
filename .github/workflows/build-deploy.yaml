# BSD-3-Clause License           https://opensource.org/license/bsd-3-clause/
#
#  pihuw docs: build the Hugo site and publish it to GitHub Pages.
#
#  The work is in mrmxf/clog's reusable workflows. What this repo wants is data
#  in .clog.yaml, and .clog-version pins the clog they install.
#
#    v* tag   build + deploy - ci.policy.deploy.prod.tags makes a tag prod
#    main     build only
#    manual   rebuild + republish the NEWEST RELEASE TAG, whatever branch the
#             run is launched from (production: true)
#
#  No secrets: the Pages push uses the Actions token, and .clog.yaml has no
#  ci.infisical block. Leave clog-repo at its default - a private release repo
#  would need a PAT in this public repo's secrets.

name: build-deploy
run-name: ${{ github.workflow }} 🥷${{ github.actor }} (${{ github.event_name }} ${{ github.ref_name }})

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: mrmxf/clog/.github/workflows/build-check.yaml@workflows
    permissions:
      contents: read
      id-token: write        # OIDC, for `clog CI run`
      security-events: write # SARIF upload of _clog_build/scan
    with:
      production: ${{ github.event_name == 'workflow_dispatch' }}

  deploy:
    needs: [build]
    uses: mrmxf/clog/.github/workflows/deploy-probe.yaml@workflows
    permissions:
      contents: write        # the Pages deploy force-pushes gh-pages
      id-token: write
    with:
      production: ${{ github.event_name == 'workflow_dispatch' }}
