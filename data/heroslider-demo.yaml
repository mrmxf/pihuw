# Demo slides for the docs site's kitchen sink (documentation/content/kitchen_sink/heroslider.md).
# The theme does not export data/, so consumers never see this file.
# Every key and its default: layouts/_partials/tk/heroslider-config.html

header: heroslider demo       # the carousel's aria-label
srcOn: left
srcWidth: 0.3
interval: 5
display_order: default

geometry:
  width: 100%
  height: 14rem
  bottom: 1em
  align: center

slides:
  - header: Image left
    text: The default arrangement. `srcOn` is `left`, `srcWidth` 0.3.
    src: /rc/laptop.svg
    alt: laptop
    weight: 10
  - header: Image right
    text: "This slide sets its own `srcOn: right`."
    src: /rc/nas.svg
    alt: NAS
    srcOn: right
    weight: 20
  - header: Text only
    text: A slide with no `src` uses the whole panel for its caption.
    weight: 30
  - src: /rc/github.svg
    alt: GitHub
    link: https://github.com/mrmxf/pihuw
    weight: 40
