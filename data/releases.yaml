- {version: "v0.4.20", date: 2026-10-08, build: prod, flow: main, note: "default fonts served by the theme, no CDN: body Atkinson Hyperlegible (400, 400 italic, 700), headings Raleway 500 (variable 500-700) on h1-h6, .pi-page-title, .pi-cover-subtitle, .button and .pi-nav. New tokens --font-heading and --font-heading-weight; --font-body changes. New 02-fonts.css, woff2 files (latin + latin-ext, ~160 KB) and OFL licences in static/webfonts. VISIBLE CHANGE for every site on the old Arial default; a site that redefines --font-body / --font-heading keeps its own fonts and never downloads these"}
- {version: "v0.4.19", date: 2026-10-08, build: prod, flow: main, note: "content images are responsive: main img { max-width: 100%; height: auto } in 80-media.css, so {{< hw t=\"image\" >}} shrinks to its column instead of overflowing it, and never stretches. VISIBLE CHANGE for a page whose images were wider than the content column - they now fit; smaller images are unchanged. srcClass=\"full\" fills the column. tool/image help corrected: srcClass is on the <img>, examples self-close and drop Fomantic classes"}
- {version: "v0.4.18", date: 2026-09-30, build: prod, flow: main, note: "new tool/heroslider (+ tk/heroslider-config, 68-component-heroslider.css) - image + text slides from a data file (inline slides, or includedata + map over an existing list), CSS geometry (width, height, align, top OR bottom), srcOn left/right/top/bottom, display_order default (weight)/reversed/random (per build and per page load), auto-advance that pauses on hover, focus and a pause button, and on narrow screens an image-then-text flip timed from the interval. In a cover: pass it as afterHTML/beforeHTML and add has-heroslider. Colours are component tokens (--heroslider-bg/-fg/-accent/-tile) defaulting to the scrim tokens. Docs page and kitchen-sink demo"}
- {version: "v0.4.17", date: 2026-09-30, build: prod, flow: main, note: "tool/cover gets two optional slots, beforeHTML and afterHTML, emitted verbatim inside the section on either side of .pi-cover-inner, for a nav or slider at the top or bottom of the band in normal flow; unset, cover output is unchanged. Font Awesome: the cdnjs all.min.js is no longer loaded (B-16, the no-CDN rule), so icons are 6.7.2 webfont glyphs in <i> elements, not SVGs. VISIBLE CHANGE for a site whose CSS targets svg.svg-inline--fa or uses data-fa-* attributes; rules that target the <i> now match. fa-brands-400.woff2 added (it was missing, so brand icons logged a failed font download), fa-solid-900.woff2 replaced with the 6.7.2 file the CSS expects; the unused fa-regular-400.ttf removed"}
- {version: "v0.4.16", date: 2026-09-28, build: prod, flow: main, note: "the theme's data/releases.yaml is no longer exported - a consumer without its own showed pihuw's version as the site version. VISIBLE CHANGE - such a site's footer version is now blank until it adds data/releases.yaml. get-version-data returns an empty dict when there is none, where it used to crash the footer; new tk/get-theme-version reads the installed theme version from hugo.Deps; the pihuw -v shortcode no longer prints vv"}
- {version: "v0.4.15", date: 2026-09-28, build: prod, flow: main, note: "repo tidy, no layout change - podserver.go and .ko.yaml removed, so `hugo mod get` in a consumer no longer tries to resolve clog's slogger/gommi Go packages; theme.toml and the dead cdn: params block deleted; the docs site publishes to _clog_build/public (consumers are unaffected and keep public/), explained in learn/building"}
- {version: "v0.4.14", date: 2026-09-23, build: prod, flow: main, note: "CI only, no theme change - builds on mrmxf/clog v1.0.2 through its build-check and deploy-probe workflows; the hugo-version gate uses `clog BC semver satisfies` (the old form passed on any hugo); build output in _clog_build/; deploy docs rewritten to match"}
- {version: "v0.4.13", date: 2026-09-21, build: prod, flow: main, note: pins clog v0.12.6 in .clog-version - the first PUBLIC clog release, from mrmxf/clog-sample, so CI can install it with no token; verified end to end with get-clog.sh unauthenticated, checksum verified, then a full build and deploy dry-run}
- {version: "v0.4.12", date: 2026-09-21, build: prod, flow: main, note: github action rebuilt on the real util callable workflows - a v* tag builds and publishes the docs, a manual run rebuilds and republishes the newest release tag; the old workflow pointed at the archived mrmxf/clog repo and a deploy-ghpages workflow that never existed; needs clog v0.12.4}
- {version: "v0.4.11", date: 2026-09-21, build: prod, flow: main, note: clog build/deploy take a mode argument - `clog deploy prod` forces a production deploy and a mistyped mode is an error rather than a silent dev build; needs clog v0.12.2}
- {version: "v0.4.10", date: 2026-09-21, build: prod, flow: main, note: "build moves to the clog ci: shape - .clog.yaml declares ci.policy/modes/targets and clog ci deploy publishes kodata to gh-pages; the hand-rolled github-page snippet and gh-static.yml are gone; releases.yaml moved to data/ and is read via hugo.Data; hugo min 0.166.0"}
- {version: "v0.4.9",  date: 2026-09-21, build: prod, flow: main, note: theme unification - relative colours migrated hsl to oklch; component tokens for scrims/shadows/tooltip; pihuw.css split into the assets/css/pihuw bundle overridable per file; SASS/PostCSS/npm removed}
- {version: "v0.4.8",  date: 2026-09-12, build: prod, flow: main, note: get-asset noPublish only suppresses rasters so SVG/GIF/video keep src; lang and og:locale read site locale; cover takes subtitle/innerHTML/class and keeps alt=""; hw passes height and subtitle}
- {version: "v0.4.7",  date: 2026-09-12, build: prod, flow: main, note: mermaid loads on demand; get-asset no longer publishes originals; canonical+OpenGraph+Twitter cards; tk/date-offset; cover and item-socials implemented}
