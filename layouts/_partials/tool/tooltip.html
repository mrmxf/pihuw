{{partial "tk/dbg-template" .}}{{/* Hugo partial that displays text with hover tooltips
Parameters:
- .text: The main text to display (will be markdownified)
- .alt: The tooltip text to show on hover
*/}}

<span class="tooltip-container" title="{{ .alt }}">
  {{ .text | markdownify }}
  <span class="tooltip-text">{{ .alt }}</span>
</span>
